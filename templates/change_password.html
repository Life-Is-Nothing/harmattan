<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HARMATTAN — Modifier le mot de passe</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◆</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-void:#070a0f; --bg-panel:#0e1420; --border:#233047;
    --text-hi:#e8ecf1; --text-mid:#8b96a8; --text-low:#565f6e;
    --cyan:#2fd9d0; --cyan-glow:rgba(47,217,208,0.5);
    --pink:#ff2fd6; --purple:#a75bff; --red:#ef4444; --green:#12a150;
    --font-display:'Space Grotesk',sans-serif; --font-mono:'IBM Plex Mono',monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg-void); color:var(--text-hi);
         font-family:var(--font-mono); display:flex; align-items:center; justify-content:center; padding:24px; }
  .grid-bg { position:fixed; inset:0; z-index:0;
    background-image:linear-gradient(rgba(47,217,208,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(47,217,208,.06) 1px,transparent 1px);
    background-size:48px 48px; animation:gp 14s linear infinite; }
  @keyframes gp { from{background-position:0 0} to{background-position:0 48px} }
  .card { position:relative; z-index:1; width:100%; max-width:420px;
    background:rgba(14,20,32,.85); border:1px solid var(--border); border-radius:14px; padding:32px 30px 26px;
    box-shadow:0 0 34px rgba(47,217,208,.12),0 0 80px rgba(255,47,214,.08); backdrop-filter:blur(10px); }
  .brand { font-family:var(--font-display); font-weight:700; letter-spacing:2px; font-size:22px; margin-bottom:4px;
    background:linear-gradient(90deg,var(--cyan),var(--pink),var(--purple)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .tagline { color:var(--text-mid); font-size:11px; letter-spacing:1px; text-transform:uppercase; margin-bottom:22px; }
  .banner { padding:10px 12px; border-radius:8px; font-size:12px; margin-bottom:16px; border:1px solid var(--orange);
            background:rgba(247,127,0,.12); color:#ffd9a8; }
  label { display:block; font-size:11px; color:var(--text-mid); letter-spacing:1px; margin:14px 0 6px; text-transform:uppercase; }
  input[type=password] { width:100%; background:rgba(0,0,0,.35); border:1px solid var(--border); color:var(--text-hi);
    font-family:var(--font-mono); font-size:15px; padding:12px 14px; border-radius:8px; outline:none; transition:border-color .2s,box-shadow .2s; }
  input:focus { border-color:var(--cyan); box-shadow:0 0 0 3px rgba(47,217,208,.18); }
  .btn { margin-top:22px; width:100%; font-family:var(--font-display); font-weight:600; letter-spacing:2px; font-size:14px;
    padding:13px; border:none; border-radius:8px; cursor:pointer; color:#041414;
    background:linear-gradient(90deg,var(--cyan),#7deae5); box-shadow:0 0 22px var(--cyan-glow); }
  .msg-ok { margin-top:14px; padding:10px 12px; border:1px solid rgba(18,161,80,.5); background:rgba(18,161,80,.12); color:#a4f0c4; font-size:12px; border-radius:8px; }
  .error { margin-top:14px; padding:10px 12px; border:1px solid rgba(239,68,68,.5); background:rgba(239,68,68,.12); color:#ffb4b4; font-size:12px; border-radius:8px; }
  .link { display:block; text-align:center; margin-top:18px; color:var(--cyan); text-decoration:none; font-size:12px; }
</style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="card">
    <div class="brand">◆ HARMATTAN</div>
    <div class="tagline">Sécurité du compte</div>

    {% if must_change %}
    <div class="banner">⚠ Premier accès : vous devez définir un nouveau mot de passe avant de continuer.</div>
    {% endif %}

    <form method="post">
      <label>Mot de passe actuel</label>
      <input type="password" name="current_password" required>
      <label>Nouveau mot de passe (min 4 caractères)</label>
      <input type="password" name="new_password" required>
      <label>Confirmer</label>
      <input type="password" name="confirm_password" required>
      <button class="btn" type="submit">ENREGISTRER ▸</button>
    </form>

    {% if ok %}<div class="msg-ok">✔ {{ ok }}</div>{% endif %}
    {% if error %}<div class="error">⚠ {{ error }}</div>{% endif %}

    <a class="link" href="{{ url_for('system.index') }}">Revenir au tableau de bord →</a>
  </div>
</body>
</html>
