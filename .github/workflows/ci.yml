name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install lint deps
        run: pip install ruff
      - name: Lint
        run: ruff check . --ignore E402,F401,E501 --exit-zero

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap0.8-dev
      - name: Install requirements
        run: |
          python -m venv venv
          . venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov
      - name: Run tests
        run: |
          . venv/bin/activate
          pytest -v --cov=core --cov=api --cov=harmattan_gui --cov-report=xml --cov-report=term -x --ignore=modules
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: ${{ matrix.python == '3.12' }}
        with:
          fail_ci_if_error: false

  build-linux:
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap0.8-dev libxcb-cursor0
      - name: Install Python deps
        run: |
          python -m venv venv
          . venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build with PyInstaller
        run: |
          . venv/bin/activate
          pyinstaller --onefile --name harmattan-desktop \
            --add-data "harmattan_gui:harmattan_gui" \
            harmattan_gui/__main__.py
      - uses: actions/upload-artifact@v4
        with:
          name: harmattan-desktop-linux
          path: dist/harmattan-desktop
