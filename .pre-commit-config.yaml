repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: debug-statements

  - repo: local
    hooks:
      - id: pytest-quick
        name: pytest (quick)
        entry: bash -c 'cd tests && python -m pytest -x -q --timeout=10 2>&1 | head -30'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
