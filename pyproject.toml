[project]
name = "harmattan"
version = "3.22.0"
description = "HARMATTAN — Network Intelligence Suite"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Mohamed Adoungouss Ibrahim"}]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E402", "F401", "E501", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["core", "modules", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests that need network access",
]
